name: V5 S11 item 023 cap precheck recovery gate

on:
  push:
    branches: [agent/v5-parent-native-study-v1]
    paths:
      - "src/v5_final/s11_cap_precheck_recovery_item023_v1.py"
      - "tests/test_v5_final_s11_cap_precheck_recovery_item023_v1.py"
      - ".github/workflows/v5-s11-cap-precheck-recovery-item023-gate.yml"
      - "artifacts/v5-final/parent-native/s11-development-execution-v1/cap-precheck-recovery/023-7d3a964d137a65b8c373a5a85362e1265ccf9fb941757cb44c99804e3ea98cdb/**"
  pull_request:

jobs:
  exact-static-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Require exact commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - name: Sync pinned environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline
      - name: Test exact outcome-free design
        env:
          PYTHONPATH: src
        run: provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s11_cap_precheck_recovery_item023_v1.py
      - name: Build exact static report
        env:
          PYTHONPATH: src
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s11_cap_precheck_recovery_item023_v1 --static-report-output "$RUNNER_TEMP/report.json"
      - name: Require claims and execution blocked
        run: python -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"report.json"))); assert r["validated_exact_commit"] == "${{ github.event.pull_request.head.sha || github.sha }}"; assert all(r["checks"].values()); assert r["authorization"]["terminal_recovery"] == "NOT_AUTHORIZED"; assert r["authorization"]["molecular_kernel"] == "NOT_AUTHORIZED"; assert r["authorization"]["performance_claim"] == "NOT_AUTHORIZED"'
      - uses: actions/upload-artifact@v4
        with:
          name: v5-s11-item023-cap-precheck-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          retention-days: 90
