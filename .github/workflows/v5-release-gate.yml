name: V5 release gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch recursive provenance tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync study audit environment
        run: uv sync --frozen --extra test

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Reconstruct latest fail-closed release gate
        run: uv run python -m v5_final.ci_release_gate_v2 --output release-gate-report.json

      - name: Require the v2 successor decision
        run: |
          grep -F '"decision": "NO_GO_V5_MATCHED_WORK_INFRASTRUCTURE_V2"' release-gate-report.json

      - name: Record exact commit and artifact hash
        run: |
          git rev-parse HEAD > exact-commit.txt
          git submodule status --recursive > exact-submodules.txt
          shasum -a 256 release-gate-report.json > release-gate-report.sha256

      - name: Upload external CI attestation
        uses: actions/upload-artifact@v4
        with:
          name: v5-release-gate-${{ github.sha }}
          path: |
            exact-commit.txt
            exact-submodules.txt
            release-gate-report.json
            release-gate-report.sha256
          if-no-files-found: error
          retention-days: 90
