name: V5 release gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Fetch recursive provenance tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync study audit environment
        run: uv sync --frozen --extra test

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Reconstruct platform-neutral S8-v2 exact-CI preflight
        run: uv run python -m v5_final.s8_parent_native_production_gate_v2 --ci-preflight-output release-gate-report.json

      - name: Require zero-outcome readiness without authorizing execution
        run: |
          uv run python -c 'import json; report = json.load(open("release-gate-report.json")); assert report["schema"] == "v5-final.s8-parent-native-exact-ci-preflight.v2"; assert report["decision"] == "READY_AWAITING_FROZEN_PLATFORM_FRESH_CLONE_EVIDENCE"; assert report["candidate_molecular_energy_evaluations"] == 0; assert report["authorization"]["H2_H4_execution"] == "NOT_AUTHORIZED_BY_CI_PREFLIGHT_ALONE"'

      - name: Record exact commit and artifact hash
        run: |
          git rev-parse HEAD > exact-commit.txt
          git submodule status --recursive > exact-submodules.txt
          shasum -a 256 release-gate-report.json > release-gate-report.sha256

      - name: Upload external CI attestation
        uses: actions/upload-artifact@v4
        with:
          name: v5-release-gate-${{ env.EXACT_SHA }}
          path: |
            exact-commit.txt
            exact-submodules.txt
            release-gate-report.json
            release-gate-report.sha256
          if-no-files-found: error
          retention-days: 90
