name: V5 release gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Fetch recursive provenance tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync study audit environment
        run: uv sync --frozen --extra test

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run complete test suite
        if: hashFiles('artifacts/v5-final/parent-native/s11-v2-preexecution-gate-v3/p7-no-go-v3.json') == ''
        run: |
          uv run pytest -q --ignore=tests/test_v5_final_s7_mb6_v4_refreeze.py --ignore=tests/test_v5_final_s8_parent_native_production_gate_v2.py --ignore=tests/test_v5_final_s9_h2_h4_calibration_runner.py
          provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s7_mb6_v4_refreeze.py tests/test_v5_final_s8_parent_native_production_gate_v2.py tests/test_v5_final_s9_h2_h4_calibration_runner.py

      - name: Reconstruct platform-neutral S8-v2 exact-CI preflight
        if: hashFiles('artifacts/v5-final/parent-native/s11-v2-preexecution-gate-v3/p7-no-go-v3.json') == ''
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s8_parent_native_production_gate_v2 --ci-preflight-output release-gate-report.json

      - name: Require zero-outcome readiness without authorizing execution
        if: hashFiles('artifacts/v5-final/parent-native/s11-v2-preexecution-gate-v3/p7-no-go-v3.json') == ''
        run: |
          provenance/dvg-obs-ceo/.venv/bin/python -c 'import json; report = json.load(open("release-gate-report.json")); assert report["schema"] == "v5-final.s8-parent-native-exact-ci-preflight.v2"; assert report["decision"] == "READY_AWAITING_FROZEN_PLATFORM_FRESH_CLONE_EVIDENCE"; assert report["candidate_molecular_energy_evaluations"] == 0; assert report["authorization"]["H2_H4_execution"] == "NOT_AUTHORIZED_BY_CI_PREFLIGHT_ALONE"'

      - name: Reconstruct S9 authoritative current-progress audit
        if: hashFiles('artifacts/v5-final/parent-native/s11-v2-preexecution-gate-v3/p7-no-go-v3.json') == ''
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner --ci-audit-output s9-release-gate-report.json

      - name: Require S9 integrity and keep development blocked
        if: hashFiles('artifacts/v5-final/parent-native/s11-v2-preexecution-gate-v3/p7-no-go-v3.json') == ''
        run: |
          provenance/dvg-obs-ceo/.venv/bin/python -c 'import json; report = json.load(open("s9-release-gate-report.json")); assert report["schema"] == "v5-final.s9-h2-h4-ci-audit.v1"; assert all(report["checks"].values()); assert report["authorization"]["development_queue_execution"] == "NOT_AUTHORIZED"; assert report["authorization"]["performance_claim"] == "NOT_AUTHORIZED"'

      - name: Audit formal P7 No-Go instead of opening release path
        if: hashFiles('artifacts/v5-final/parent-native/s11-v2-preexecution-gate-v3/p7-no-go-v3.json') != ''
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m
          v5_final.s11_v2_preexecution_gate --audit

      - name: Record exact commit and submodules
        run: |
          git rev-parse HEAD > exact-commit.txt
          git submodule status --recursive > exact-submodules.txt

      - name: Upload external CI attestation
        uses: actions/upload-artifact@v4
        with:
          name: v5-release-gate-${{ env.EXACT_SHA }}
          path: |
            exact-commit.txt
            exact-submodules.txt
          if-no-files-found: error
          retention-days: 90
