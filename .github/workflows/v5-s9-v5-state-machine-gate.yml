name: V5 S9 v5 state-machine gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s9-v5-state-machine-gate:
    name: s9-v5-state-machine-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      V5_S9_V5_EXECUTION_VENUE: github-actions-ubuntu-24.04-x64-single-job
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Fetch recursive provenance tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run S9 v5 state-machine tests
        run: provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s9_h2_h4_calibration_runner_v5.py

      - name: Reconstruct immutable S9 v4 halt
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v4_preauthorization_halt

      - name: Reconstruct exact pre-stage audit outside worktree
        run: |
          if test -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-v5-runtime-platform-halt-v1.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v5_platform_halt
          else
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v5 --ci-audit-output "$RUNNER_TEMP/s9-v5-pre-stage-report.json"
          fi

      - name: Require common academic and engineering boundary
        run: |
          if test -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-v5-runtime-platform-halt-v1.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -c 'from v5_final.s9_v5_platform_halt import audit_halt; assert all(audit_halt().values())'
          else
            provenance/dvg-obs-ceo/.venv/bin/python -c 'import json, os; report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "s9-v5-pre-stage-report.json"))); progress = report["progress"]; assert report["validated_exact_commit"] == os.environ["EXACT_SHA"]; assert report["run_namespace"] == "s9-h2-h4-calibration-v5"; assert report["execution_venue"] == "github-actions-ubuntu-24.04-x64-single-job"; assert progress["expected_item_count"] == 36; assert report["candidate_molecular_energy_evaluations"] == progress["candidate_energy_evaluations"]; assert report["authorization"]["development_queue_execution"] == "NOT_AUTHORIZED"; assert report["authorization"]["performance_claim"] == "NOT_AUTHORIZED"; assert all(report["checks"].values()); assert all(report["v4_preauthorization_halt_audit"].values()); assert all(report["v5_checks"].values())'
          fi

      - name: Advance at most one frozen state-machine stage
        run: |
          if test -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-v5-runtime-platform-halt-v1.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v5_platform_halt
          elif test ! -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-runner-readiness-v5.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v5 --write-readiness
          elif test ! -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-execution-authorization-v5.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v5 --write-readiness-ci-evidence --ci-report "$RUNNER_TEMP/s9-v5-pre-stage-report.json" --ci-evidence-output "$RUNNER_TEMP/s9-v5-readiness-ci-evidence.json" --run-id "$GITHUB_RUN_ID"
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v5 --write-authorization --ci-evidence "$RUNNER_TEMP/s9-v5-readiness-ci-evidence.json"
          elif test ! -d artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/item-receipts; then
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v5 --run --max-items 36
          fi

      - name: Reconstruct exact post-stage audit
        if: always()
        run: |
          if test -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-v5-runtime-platform-halt-v1.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v5_platform_halt
          else
            provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v5 --ci-audit-output "$RUNNER_TEMP/s9-v5-post-stage-report.json"
          fi

      - name: Require allowed post-stage state
        run: |
          if test -e artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-v5-runtime-platform-halt-v1.json; then
            provenance/dvg-obs-ceo/.venv/bin/python -c 'from v5_final.s9_v5_platform_halt import audit_halt; assert all(audit_halt().values())'
          else
            provenance/dvg-obs-ceo/.venv/bin/python -c 'import json, os; report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "s9-v5-post-stage-report.json"))); progress = report["progress"]; assert report["validated_exact_commit"] == os.environ["EXACT_SHA"]; assert report["candidate_molecular_energy_evaluations"] == progress["candidate_energy_evaluations"]; assert report["authorization"]["development_queue_execution"] == "NOT_AUTHORIZED"; assert report["authorization"]["performance_claim"] == "NOT_AUTHORIZED"; assert all(report["checks"].values()); assert all(report["v5_checks"].values()); assert (progress["completed_terminal_count"] == 0 and report["namespace_halted"] is False) or (progress["completed_terminal_count"] == progress["expected_item_count"] == 36 and progress["complete"] is True and progress["terminal_status_counts"]["KERNEL_FAILURE"] == 0 and progress["all_post_item_capacity_checks_passed"] is True and report["namespace_halted"] is False)'
          fi

      - name: Record exact commit and submodules
        if: always()
        run: |
          git rev-parse HEAD > exact-commit.txt
          git submodule status --recursive > exact-submodules.txt

      - name: Upload all v5 state-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-s9-v5-state-machine-${{ env.EXACT_SHA }}
          path: |
            artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/
            ${{ runner.temp }}/s9-v5-pre-stage-report.json
            ${{ runner.temp }}/s9-v5-readiness-ci-evidence.json
            ${{ runner.temp }}/s9-v5-post-stage-report.json
            exact-commit.txt
            exact-submodules.txt
          if-no-files-found: error
          retention-days: 90
