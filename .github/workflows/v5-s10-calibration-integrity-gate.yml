name: V5 S10 calibration integrity gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s10-calibration-integrity-gate:
    name: s10-calibration-integrity-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run S10 integrity tests
        run: provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s10_calibration_integrity_v1.py

      - name: Rebuild S10 audit outside worktree
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s10_calibration_integrity_v1 --build-output "$RUNNER_TEMP/s10-calibration-integrity.json"

      - name: Require negative-result retention and downstream block
        run: |
          provenance/dvg-obs-ceo/.venv/bin/python -c 'import json, os; artifact = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "s10-calibration-integrity.json"))); assert artifact["decision"] == "GO_90_ITEM_EXECUTION_BINDING_FREEZE_ONLY"; assert artifact["S9_v6"]["completed_terminal_count"] == 36; assert artifact["S9_v6"]["candidate_molecular_energy_evaluations"] == 84; assert artifact["scientific_result"]["classification"] == "CALIBRATION_NEGATIVE_RESULT_NO_COMPRESSION_ACCEPTED"; assert artifact["authorization"]["existing_90_item_queue_execution"] == "NOT_AUTHORIZED"; assert artifact["authorization"]["successor_90_item_queue_execution"] != "AUTHORIZED"; assert artifact["authorization"]["performance_claim"] == "NOT_AUTHORIZED"; assert all(artifact["checks"].values())'

      - name: Audit immutable S10 artifact if frozen
        if: hashFiles('artifacts/v5-final/parent-native/s10-calibration-integrity-v1.json') != ''
        run: provenance/dvg-obs-ceo/.venv/bin/python -c 'from v5_final.s10_calibration_integrity_v1 import audit; assert all(audit().values())'

      - name: Upload exact S10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v5-s10-integrity-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/s10-calibration-integrity.json
          if-no-files-found: error
          retention-days: 90
