name: V5 S11-v1 infrastructure closure gate

on:
  pull_request:
  push:
    branches:
      - agent/s11-v2-verifier-remediation

permissions:
  contents: read

jobs:
  s11-v1-infrastructure-closure-gate:
    name: s11-v1-infrastructure-closure-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          submodules: recursive
          fetch-depth: 0
      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true
      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline
      - name: Verify frozen incident and closure hashes
        run: >-
          sha256sum -c
          artifacts/v5-final/parent-native/s11-development-execution-v1/incident-evidence/item-028-long-running-dense-expm-v1/MANIFEST.sha256
          artifacts/v5-final/parent-native/s11-development-execution-v1/incident-evidence/s11-v1-infrastructure-closure-v1/MANIFEST.sha256
      - name: Run platform-neutral controlled-termination and closure tests
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q
          tests/test_v5_final_s11_v1_controlled_termination_item028_v1.py
          tests/test_v5_final_s11_v1_infrastructure_closure_v1.py::test_closure_is_an_immutable_digest_valid_historical_artifact
          tests/test_v5_final_s11_v1_infrastructure_closure_v1.py::test_closure_forbids_performance_and_future_execution
      - name: Require byte-reconstructible fail-closed boundary
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m
          v5_final.s11_v1_infrastructure_closure_v1 --audit
