name: V5 S11-v2 outcome-free calibration gate

on:
  pull_request:
  push:
    branches:
      - agent/s11-v2-verifier-remediation

permissions:
  contents: read

jobs:
  s11-v2-outcome-free-calibration-gate:
    name: s11-v2-outcome-free-calibration-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          submodules: recursive
          fetch-depth: 0
      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true
      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline
      - name: Run structural-boundary and verifier tests
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q
          tests/test_v5_final_s11_v2_outcome_free_calibration.py
          tests/test_v5_final_verifier_v2.py
          tests/test_v5_final_s11_v2_verifier_design_audit.py
      - name: Audit frozen Darwin calibration evidence
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m
          v5_final.s11_v2_outcome_free_calibration --audit
