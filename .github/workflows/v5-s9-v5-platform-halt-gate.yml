name: V5 S9 v5 platform halt gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s9-v5-platform-halt-gate:
    name: s9-v5-platform-halt-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run v5 platform-halt tests
        run: provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s9_v5_platform_halt.py

      - name: Reconstruct v5 platform halt
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v5_platform_halt

      - name: Require immutable halt if frozen
        if: hashFiles('artifacts/v5-final/parent-native/s9-h2-h4-calibration-v5/s9-v5-runtime-platform-halt-v1.json') != ''
        run: provenance/dvg-obs-ceo/.venv/bin/python -c 'from v5_final.s9_v5_platform_halt import audit_halt; assert all(audit_halt().values())'
