name: V5 S9 v3 environment gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s9-v3-environment-gate:
    name: s9-v3-environment-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Fetch recursive provenance tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run S9 v3 environment-gate tests
        run: provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s9_h2_h4_calibration_runner_v3.py

      - name: Reconstruct immutable S9 v1 and v2 halts
        run: |
          provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v1_zero_dimensional_halt
          provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v2_thread_environment_halt

      - name: Reconstruct isolated S9 v3 current-progress audit
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v3 --ci-audit-output s9-v3-release-gate-report.json

      - name: Require environment-gate integrity and downstream blocks
        run: |
          provenance/dvg-obs-ceo/.venv/bin/python -c 'import json, os; report = json.load(open("s9-v3-release-gate-report.json")); assert report["validated_exact_commit"] == os.environ["EXACT_SHA"]; assert report["run_namespace"] == "s9-h2-h4-calibration-v3"; assert report["progress"]["expected_item_count"] == 36; assert report["candidate_molecular_energy_evaluations"] == report["progress"]["candidate_energy_evaluations"]; assert report["authorization"]["development_queue_execution"] == "NOT_AUTHORIZED"; assert report["authorization"]["performance_claim"] == "NOT_AUTHORIZED"; assert all(report["checks"].values()); assert all(report["v2_halt_audit"].values()); assert all(report["v3_checks"].values())'

      - name: Record exact commit and artifact hash
        run: |
          git rev-parse HEAD > exact-commit.txt
          git submodule status --recursive > exact-submodules.txt
          shasum -a 256 s9-v3-release-gate-report.json > s9-v3-release-gate-report.sha256

      - name: Upload S9 v3 external CI attestation
        uses: actions/upload-artifact@v4
        with:
          name: v5-s9-v3-environment-gate-${{ env.EXACT_SHA }}
          path: |
            exact-commit.txt
            exact-submodules.txt
            s9-v3-release-gate-report.json
            s9-v3-release-gate-report.sha256
          if-no-files-found: error
          retention-days: 90
