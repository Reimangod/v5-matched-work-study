name: V5 S9 v6 local Darwin gate

on:
  pull_request:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s9-v6-static-integrity-gate:
    name: s9-v6-static-integrity-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe

    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline

      - name: Run outcome-free v6 tests
        run: provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q tests/test_v5_final_s9_h2_h4_calibration_runner_v6.py

      - name: Reconstruct immutable v5 platform halt
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_v5_platform_halt

      - name: Build platform-neutral static v6 audit
        run: provenance/dvg-obs-ceo/.venv/bin/python -m v5_final.s9_h2_h4_calibration_runner_v6 --static-audit-output "$RUNNER_TEMP/s9-v6-static-ci-report.json"

      - name: Require academic and systems boundary
        run: |
          provenance/dvg-obs-ceo/.venv/bin/python -c 'import json, os; report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "s9-v6-static-ci-report.json"))); progress = report["progress"]; assert report["validated_exact_commit"] == os.environ["EXACT_SHA"]; assert report["run_namespace"] == "s9-h2-h4-calibration-v6"; assert progress["expected_item_count"] == 36; assert all(report["checks"].values()); assert report["authorization"]["development_queue_execution"] == "NOT_AUTHORIZED"; assert report["authorization"]["performance_claim"] == "NOT_AUTHORIZED"; assert (progress["completed_terminal_count"] == 0 and report["namespace_halted"] is False) or (progress["completed_terminal_count"] == 36 and progress["complete"] is True and progress["terminal_status_counts"]["KERNEL_FAILURE"] == 0 and progress["all_post_item_capacity_checks_passed"] is True and report["namespace_halted"] is False) or report["namespace_halted"] is True'

      - name: Record exact commit and submodules
        run: |
          git rev-parse HEAD > exact-commit.txt
          git submodule status --recursive > exact-submodules.txt

      - name: Upload static v6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v5-s9-v6-static-${{ env.EXACT_SHA }}
          path: |
            artifacts/v5-final/parent-native/s9-h2-h4-calibration-v6/
            ${{ runner.temp }}/s9-v6-static-ci-report.json
            exact-commit.txt
            exact-submodules.txt
          if-no-files-found: error
          retention-days: 90
