name: V5 S11-v2 outcome-cap and queue-v2 gate

on:
  pull_request:
  push:
    branches:
      - agent/s11-v2-verifier-remediation

permissions:
  contents: read

jobs:
  s11-v2-outcome-cap-queue-v2-gate:
    name: s11-v2-outcome-cap-queue-v2-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/provenance/dvg-obs-ceo/src:${{ github.workspace }}/provenance/dvg-obs-ceo/vendor/ceo-adapt-vqe
    steps:
      - name: Checkout exact commit and recursive provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SHA }}
          submodules: recursive
          fetch-depth: 0
      - name: Require checkout to equal requested exact commit
        run: test "$(git rev-parse HEAD)" = "$EXACT_SHA"
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.8"
          enable-cache: true
      - name: Sync pinned parent baseline environment
        working-directory: provenance/dvg-obs-ceo
        run: uv sync --frozen --extra baseline
      - name: Test cap extraction accounting and queue-v2 enforcement
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m pytest -q
          tests/test_v5_final_s11_v2_outcome_cap_and_queue_v2.py
          tests/test_v5_final_s5_parent_native_work_accounting_audit.py
          tests/test_v5_final_s6_parent_native_persistent_runner_audit.py
      - name: Audit frozen outcome caps and primitive crosswalk
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m
          v5_final.s11_v2_outcome_cap_freeze --audit
      - name: Audit additive queue v2 and semantic diff
        run: >-
          provenance/dvg-obs-ceo/.venv/bin/python -m
          v5_final.s11_v2_queue_freeze_v2 --audit
